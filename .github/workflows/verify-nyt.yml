name: Verify NY Times API

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify NY Times API
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: node HW8/test-api.js
