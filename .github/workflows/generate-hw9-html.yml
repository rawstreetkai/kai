name: Generate HW9 HTML Result

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate structured JSON and HTML
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HTML_ONLY: "1"
        run: node HW9/generate-json.js

      - name: Save updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HW9/results.html
          if ! git diff --cached --quiet; then
            git commit -m "Update HW9 HTML result"
            git push
          fi
